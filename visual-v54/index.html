<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vila Viva · Laboratório Visual V5.4</title>
<style>body{margin:0;background:#101b22;color:#e9f3e5;font:14px system-ui}header,footer{padding:12px 16px;background:#172b30}h1{font-size:19px;margin:0}main{max-width:1200px;margin:auto}canvas{width:100%;height:auto;display:block;background:#182e31;touch-action:pan-y}nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px}button{background:#2a5148;color:white;border:1px solid #658b76;border-radius:8px;padding:10px;cursor:pointer}button:focus-visible{outline:3px solid #ffd46c}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px;padding:12px}.metric{background:#20343a;padding:10px;border-radius:8px}.track{height:7px;background:#50616a;border-radius:9px;overflow:hidden}.bar{height:100%;background:#7acb8b}.note{padding:0 14px;color:#c7d8d4}.spectator nav,.spectator .metrics,.spectator .note{display:none}.spectator canvas{max-height:calc(100vh - 90px);object-fit:contain}#log{padding:10px;min-height:20px}</style>
<main id="app"><header><h1>⚔️ Vila Viva · Mundo físico V5.4</h1><small id="summary">Protótipo visual isolado, sem TikTok, Supabase ou login</small></header><canvas id="world" width="1000" height="570" aria-label="Mapa visual dos cinco biomas com vila, expansão, construção e destruição"></canvas>
<nav><button id="expand">🗺️ Expandir</button><button id="build">🏗️ Construir</button><button id="attack">🔥 Invasão</button><button id="repair">🛠️ Reconstruir</button><button id="season">🌦️ Estação</button><button id="spectate">🎥 Modo espectador</button><button id="reset">↺ Reiniciar</button></nav>
<p class="note">Cada ação altera entidades desenhadas no mapa. Os percentuais abaixo medem critérios observáveis neste protótipo, não o jogo Lovable original.</p><section class="metrics" id="metrics"></section><footer id="log" aria-live="polite"></footer></main>
<script>
(()=>{'use strict';const C=document.querySelector('#world'),ctx=C.getContext('2d'),$=s=>document.querySelector(s),W=C.width,H=C.height;
const biomes=[{name:'Vale Florestal',color:'#376b45',accent:'#6fa75e',symbol:'🌲'},{name:'Sertão Seco',color:'#9b8251',accent:'#c8a66b',symbol:'🌵'},{name:'Planalto Gelado',color:'#8da8b5',accent:'#d6e8ec',symbol:'❄️'},{name:'Costa das Marés',color:'#3c8799',accent:'#9ed4d6',symbol:'⛵'},{name:'Dunas do Sul',color:'#bb965d',accent:'#e1c17e',symbol:'🏜️'}];
const base=[25,10,15,5,10,10,10],labels=['Economia e produção','Expansão territorial','Construção progressiva','Destruição física','Biomas e clima','Combate e facções','Modo espectador'];
let s;const reset=()=>{s={tick:0,season:0,territory:1,resources:18,trade:0,attacks:0,repairs:0,spectator:false,buildings:[{x:440,y:275,stage:3,hp:100,type:'castelo'},{x:360,y:355,stage:3,hp:100,type:'casa'},{x:510,y:360,stage:2,hp:100,type:'oficina'}],events:[]};$('#app').classList.remove('spectator');update('Mundo inicial carregado')};
const announce=m=>{s.events.unshift(m);s.events=s.events.slice(0,5);$('#log').textContent=m};
function update(m){announce(m);$('#summary').textContent='Territórios '+s.territory+'/5 · Edifícios '+s.buildings.length+' · recursos '+s.resources+' · invasões '+s.attacks+' · estação '+['Verão','Outono','Inverno','Primavera'][s.season];metrics();draw()}
function metrics(){const tests=[s.trade>0,s.territory>1,s.buildings.some(b=>b.stage<3),s.buildings.some(b=>b.hp<100),s.season>0,s.attacks>0,s.spectator];$('#metrics').innerHTML=labels.map((l,i)=>{const v=base[i];return '<div class="metric"><b>'+l+'</b><p>'+v+'% inicial · '+(tests[i]?'evidência acionada':'sem evidência acionada')+'</p><div class="track"><div class="bar" style="width:'+v+'%"></div></div></div>'}).join('')}
function rand(n){const x=Math.sin(n*127.1+73.7)*43758.5453;return x-Math.floor(x)}
function hill(x,y,w,h,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fill()}
function tree(x,y){ctx.fillStyle='#493b30';ctx.fillRect(x-3,y,6,16);ctx.fillStyle='#245338';ctx.beginPath();ctx.moveTo(x,y-22);ctx.lineTo(x-14,y+5);ctx.lineTo(x+14,y+5);ctx.fill()}
function building(b){const damaged=b.hp<100,complete=b.stage>=3;ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#0005';hill(0,22,40,11,'#0005');ctx.fillStyle=damaged?'#73534b':complete?'#d7bc8b':'#9b8262';ctx.fillRect(-25,-12,50,36);ctx.fillStyle=damaged?'#5b3531':complete?'#7c4c42':'#b2a179';ctx.beginPath();ctx.moveTo(-31,-12);ctx.lineTo(0,-36);ctx.lineTo(31,-12);ctx.fill();ctx.fillStyle='#342f2d';ctx.fillRect(-7,5,14,19);if(b.type==='castelo'){ctx.fillStyle='#b0b7a6';ctx.fillRect(-35,-45,15,35);ctx.fillRect(20,-45,15,35);ctx.fillStyle='#f1d27a';ctx.fillRect(-4,-55,8,20)}if(!complete){ctx.strokeStyle='#f7d88d';ctx.lineWidth=3;ctx.strokeRect(-29,-38,58,62)}if(damaged){ctx.strokeStyle='#2c2422';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-12,-5);ctx.lineTo(0,6);ctx.lineTo(-5,20);ctx.stroke();ctx.fillStyle='#f17c4c';ctx.font='21px system-ui';ctx.fillText('🔥',13,-35)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#193c44';ctx.fillRect(0,0,W,H);biomes.forEach((b,i)=>{const x=15+i*198,unlocked=i<s.territory;ctx.globalAlpha=unlocked?1:.42;ctx.fillStyle=b.color;ctx.fillRect(x,70,190,420);ctx.fillStyle=b.accent;for(let j=0;j<25;j++){const px=x+15+rand(i*100+j)*160,py=110+rand(i*200+j)*345;hill(px,py,5+rand(j)*16,3+rand(j+5)*9,b.accent);if(i===0&&j<12)tree(px,py);if(i===2&&j<8){ctx.fillStyle='#eef5f6';ctx.fillRect(px,py,10,4)}if(i===3&&j<10){ctx.fillStyle='#75c5d8';ctx.fillRect(px,py,18,4)}}ctx.fillStyle='#101d23bb';ctx.fillRect(x+5,78,180,34);ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText(b.symbol+' '+b.name,x+12,100);if(!unlocked){ctx.fillStyle='#fff';ctx.font='bold 19px system-ui';ctx.fillText('🔒',x+75,280)}ctx.globalAlpha=1});ctx.strokeStyle='#e8d5a8';ctx.lineWidth=7;ctx.setLineDash([15,8]);ctx.beginPath();ctx.moveTo(70,420);ctx.bezierCurveTo(290,260,650,480,920,250);ctx.stroke();ctx.setLineDash([]);s.buildings.forEach(building);ctx.fillStyle='#101d23d9';ctx.fillRect(0,0,W,60);ctx.fillStyle='#fff';ctx.font='bold 23px system-ui';ctx.fillText('🏰 VILA VIVA · '+['VERÃO','OUTONO','INVERNO','PRIMAVERA'][s.season],22,37);ctx.font='16px system-ui';ctx.fillText('🌍 '+s.territory+'/5   🏠 '+s.buildings.length+'   ⚔️ '+s.attacks,730,35);if(s.spectator){ctx.fillStyle='#101d23cb';ctx.fillRect(160,506,680,44);ctx.fillStyle='#fff';ctx.font='17px system-ui';ctx.textAlign='center';ctx.fillText(s.events[0]||'O mundo segue vivo',500,534);ctx.textAlign='left'}}
$('#expand').onclick=()=>{if(s.territory<5){s.territory++;s.resources+=8;update('Nova fronteira alcançada: '+biomes[s.territory-1].name)}else update('Cinco territórios conectados')};
$('#build').onclick=()=>{const unfinished=s.buildings.find(b=>b.stage<3);if(unfinished){unfinished.stage++;s.resources=Math.max(0,s.resources-3);update('Obra avançou para etapa '+unfinished.stage+'/3')}else{const n=s.buildings.length;s.buildings.push({x:270+(n*83)%480,y:230+(n*47)%200,stage:1,hp:100,type:'casa'});s.resources=Math.max(0,s.resources-5);s.trade++;update('Nova casa iniciada com andaimes visíveis')}};
$('#attack').onclick=()=>{s.attacks++;const b=s.buildings[(s.attacks)%s.buildings.length];b.hp=Math.max(0,b.hp-45);update('Invasão '+s.attacks+': '+b.type+' sofreu dano, telhado e parede alterados')};
$('#repair').onclick=()=>{const b=s.buildings.find(b=>b.hp<100);if(b){b.hp=Math.min(100,b.hp+50);s.repairs++;update('Mutirão restaurou '+b.type+' para '+b.hp+'%')}else update('Nenhuma estrutura danificada')};
$('#season').onclick=()=>{s.season=(s.season+1)%4;update('Estação alterada: terreno e iluminação atualizados')};
$('#spectate').onclick=()=>{s.spectator=!s.spectator;$('#app').classList.toggle('spectator',s.spectator);update(s.spectator?'Direção de cena: modo espectador':'Painel de operação restaurado')};
$('#reset').onclick=reset;reset();
})();
</script></html>
